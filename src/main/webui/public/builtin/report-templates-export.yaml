    title\":\"C.14 Capital imposable dans le canton\",\"level\":3,\"showAccounts\"\
    :false}]}"
- name: "Trial Balance"
  description: "Trial balance showing all accounts with debits and credits"
  template_content: "{\"sections\":[{ \"title\":\"Cash\",\"accountTypes\":[\"CASH\"\
    ],\"showDebitsCredits\":true},{ \"title\":\"Assets\",\"accountTypes\":[\"ASSET\"\
    ],\"showDebitsCredits\":true},{ \"title\":\"Liabilities\",\"accountTypes\":[\"\
    LIABILITY\"],\"showDebitsCredits\":true,\"invertSign\":true},{ \"title\":\"Equity\"\
    ,\"accountTypes\":[\"EQUITY\"],\"showDebitsCredits\":true,\"invertSign\":true},{\
    \ \"title\":\"Revenue\",\"accountTypes\":[\"REVENUE\"],\"showDebitsCredits\":true,\"\
    invertSign\":true},{ \"title\":\"Expenses\",\"accountTypes\":[\"EXPENSE\"],\"\
    showDebitsCredits\":true}]}"
- name: "Swiss Cash Flow Statement"
  description: "Swiss SME standard cash flow statement using the indirect method. Computes\
    \ cash flows from operating, investing and financing activities and reconciles\
    \ them to opening and closing cash. Operates across all journals in the chain."
  template_content: "{\"sections\":[{\"title\":\"Swiss Cash Flow Statement\",\"calculated\":\"cashFlow\",\"useJournalChain\":true,\"cashFlowConfig\":{\"depreciation\":{\"title\":\"Depreciation (money set aside, not spent)\",\"includeAccountNameRegex\":\"^6:6800\"},\"workingCapital\":[{\"title\":\"Money customers owe us (receivables)\",\"includeAccountNameRegex\":\"^1:10:110\"},{\"title\":\"Stock / inventory we bought\",\"includeAccountNameRegex\":\"^1:10:120\"},{\"title\":\"Other money owed to us\",\"includeAccountNameRegex\":\"^1:10:130\"},{\"title\":\"Money we owe suppliers (payables)\",\"includeAccountNameRegex\":\"^2:20:200\"},{\"title\":\"Other money we owe\",\"includeAccountNameRegex\":\"^2:20:220\"},{\"title\":\"Money received in advance\",\"includeAccountNameRegex\":\"^2:20:23\"},{\"title\":\"Money set aside for future costs (provisions)\",\"includeAccountNameRegex\":\"^2:20:24\"}],\"investing\":[{\"title\":\"Shares in other companies bought or sold\",\"includeAccountNameRegex\":\"^1:14:140\",\"excludeAccountNameRegex\":\"^1:14:140:1409\"},{\"title\":\"Equipment, machines, furniture bought or sold\",\"includeAccountNameRegex\":\"^1:14:150\",\"excludeAccountNameRegex\":\"^1:14:150:1509\"}],\"financing\":[{\"title\":\"Loans taken out or repaid\",\"includeAccountNameRegex\":\"^2:20:210\"},{\"title\":\"Money put in or taken out by owners\",\"includeAccountNameRegex\":\"^2:28:280\"}]}}]}"
- name: "Unpaid Sales Invoices"
  description: "List of unpaid sales invoices with outstanding balances. Groups transactions\
    \ by invoice tag value (invoice:SI*) and shows net balance per invoice. The balance\
    \ is calculated only from Accounts Receivable (account 1100) - if the net in AR\
    \ is zero, the invoice is paid. Searches across all journals in the chain."
  template_content: "{\n      \"sections\": [\n        {\n          \"title\": \"\
    Unpaid Sales Invoices\",\n          \"calculated\": \"tagGrouped\",\n        \
    \  \"tagKey\": \"invoice\",\n          \"tagValuePrefix\": \"SI\",\n         \
    \ \"balanceAccountNameRegex\": \"1100\",\n          \"useJournalChain\": true,\n\
    \          \"sortable\": true,\n          \"defaultSortColumn\": \"net\",\n  \
    \        \"defaultSortDirection\": \"desc\"\n        }\n      ]\n    }"
- name: "Swiss Insolvency Risk Check"
  description: "Checks whether the company is approaching or has reached the Swiss legal threshold for over-indebtedness (CO Art. 725). Shows equity cushion, liquid assets and solvency margin."
  template_content: "{\"sections\":[{\"title\":\"Swiss Insolvency Risk Check\",\"calculated\":\"solvencyCheck\",\"solvencyConfig\":{\"receivablesRegex\":\"^1:10:110\",\"protectedEquityRegex\":\"^2:28:280|^2:290:2950\"}}]}"
