abstraccount_export_version: '1.0'
artefact_type: macros
items:
- name: BankingExpense
  description: Payment for banking expenses
  parameters: '[{"name":"date","type":"date","prompt":"Transaction date","defaultValue":"{today}","required":true},{"name":"description","type":"text","prompt":"Description","required":true},{"name":"invoice_number","type":"code","prompt":"Invoice
    number (8 digits)","defaultValue":"{next_invoice_PI}","required":true},{"name":"amount","type":"amount","prompt":"Amount (e.g., 5.00)","required":true},{"name":"bank_account","type":"account","prompt":"Bank
    account (1..)","filter":"^1.*:10.*:100.*:1020.*$","required":true},{"name":"expense_account","type":"account","prompt":"Financial expense account (6..)","filter":"^6.*:6900.*$","required":true}]'
  template: "{date} * P00000004 | {description}\n    ; Payment:, invoice:{invoice_number}\n    {expense_account}        {default_currency} {amount}\n    {bank_account}           {default_currency} -{amount}"
  validation: '{"balanceCheck":true,"minPostings":2}'
  notes: 'Use this macro to record bank fees, transaction charges, or other banking-related expenses. Example: Monthly bank account maintenance fee of CHF 5. Debit: Banking expense account (increases expense).
    Credit: Bank account (cash goes out).'
- name: CustomerPaysInvoice
  description: Customer pays a previously sent invoice
  parameters: '[{"name":"date","type":"date","prompt":"Transaction date","defaultValue":"{today}","required":true},{"name":"partner","type":"partner","prompt":"Partner (customer)","required":true},{"name":"invoice_number","type":"invoice","prompt":"Invoice
    number (8 digits)","defaultValue":"","required":true},{"name":"amount","type":"amount","prompt":"Amount (e.g., 100.50)","required":true},{"name":"description","type":"text","prompt":"Description","required":true},{"name":"ingoing_account","type":"account","prompt":"Ingoing
    account (1..)","filter":"^1.*:10.*:100.*:10[0-9]0.*$","required":true},{"name":"receivable_account","type":"account","prompt":"Receivable account (1100)","filter":"^1.*:10.*:110.*:1100.*$","required":true}]'
  template: "{date} * {partner} | {description}\n    ; invoice:{invoice_number}\n    {ingoing_account}      {default_currency} {amount}\n    {receivable_account}   {default_currency} -{amount}"
  validation: '{"balanceCheck":true,"minPostings":2}'
  notes: 'Use this macro when a customer pays an invoice you previously sent. This clears the accounts receivable created by InvoiceForServicesOrSaas. Example: Customer pays CHF 2000 invoice. Debit: Bank
    account (cash comes in). Credit: Accounts Receivable (reduces asset, customer no longer owes you).'
- name: InventoryAdjustment UNTESTED
  description: Adjust inventory value for obsolete, damaged, or depreciated goods (year-end closing)
  parameters: '[{"name":"date","type":"date","prompt":"Adjustment date","defaultValue":"{today}","required":true},{"name":"description","type":"text","prompt":"Description (e.g., Year-end inventory write-down)","required":true},{"name":"adjustment_amount","type":"amount","prompt":"Adjustment
    amount (positive for write-down)","required":true},{"name":"inventory_account","type":"account","prompt":"Inventory account (120x)","filter":"^1.*:10.*:120.*:12[0-9][0-9].*$","required":true},{"name":"expense_account","type":"account","prompt":"Expense
    account (typically 6700 Other operating expenses)","filter":"^6.*:6700.*$","required":true}]'
  template: "{date} * Inventory adjustment | {description}\n    ; YearEnd:InventoryAdjustment\n    {expense_account}        {default_currency} {adjustment_amount}\n    {inventory_account}      {default_currency} -{adjustment_amount}"
  validation: '{"balanceCheck":true,"minPostings":2}'
  notes: 'Use this macro at year-end to write down inventory value for obsolete or damaged goods. This is a year-end closing adjustment. Example: CHF 10 of components are obsolete and worthless. Debit:
    Expense account (increases expense, reduces profit). Credit: Inventory account (reduces asset value).'
- name: InvoiceForServicesOrSaas
  description: Invoice sent to a partner for services rendered or SaaS
  parameters: '[{"name":"date","type":"date","prompt":"Transaction date","defaultValue":"{today}","required":true},{"name":"partner","type":"partner","prompt":"Partner (customer)","required":true},{"name":"invoice_number","type":"invoice","prompt":"Invoice
    number (8 digits)","defaultValue":"{next_invoice_SI}","required":true},{"name":"amount","type":"amount","prompt":"Amount (e.g., 100.50)","required":true},{"name":"description","type":"text","prompt":"Description","required":true},{"name":"revenue_account","type":"account","prompt":"Revenue
    account (3..)","filter":"^3.*:3400.*$|^3.*:3600.*$","required":true},{"name":"receivable_account","type":"account","prompt":"Receivable account (1100)","filter":"^1.*:10.*:110.*:1100.*$","required":true}]'
  template: "{date} * {partner} | {description}\n    ; invoice:{invoice_number}\n    {revenue_account}      {default_currency} -{amount}\n    {receivable_account}   {default_currency} {amount}"
  validation: '{"balanceCheck":true,"minPostings":2}'
  notes: 'Use this macro when sending an invoice to a customer for services or SaaS. Revenue is recognized when the invoice is sent (accrual accounting). Example: Invoicing a customer CHF 2000 for consulting
    services. Debit: Accounts Receivable (asset, customer owes you). Credit: Revenue account (increases revenue).'
- name: LegalReserveAllocation
  description: Allocate 5% of annual profit to legal reserves (MANDATORY for Swiss Sàrl until reserves reach 20% of capital)
  parameters: '[{"name":"date","type":"date","prompt":"Allocation date (typically December 31)","defaultValue":"{year}-12-31","required":true},{"name":"allocation_amount","type":"amount","prompt":"Amount
    to allocate (5% of profit, or less if target reached)","required":true},{"name":"description","type":"text","prompt":"Description","defaultValue":"Legal reserve allocation for {year} (5% of profit)","required":true}]'
  template: "{date} | {description}\n    ; YearEnd:LegalReserve\n    2:290:2979    {default_currency} {allocation_amount}\n    2:290:2950    {default_currency} -{allocation_amount}"
  validation: '{"balanceCheck":true,"minPostings":2}'
  notes: 'MANDATORY for Swiss Sàrl (CO Art. 671-671a): Allocate 5% of annual profit to legal reserves. Continue until reserves reach 20% of share capital. For CHF 20,000 capital, target is CHF 4,000. Example:
    Annual profit is CHF 10,000 - 5% allocation = CHF 500 - Debit 2979 (Annual profit): CHF 500 (reduces distributable profit) - Credit 2950 (Legal reserves): CHF 500 (increases reserves). Stop allocating
    once 2950 balance reaches CHF 4,000 (20% of CHF 20,000).'
- name: PayInvoiceFromBank
  description: Paying an invoice using the bank, paying direct to the supplier
  parameters: '[{"name":"invoice_date","type":"date","prompt":"Invoice date","defaultValue":"{today}","required":true},{"name":"payment_date","type":"date","prompt":"Payment date (>= invoice date)","defaultValue":"{today}","required":true},{"name":"partner","type":"partner","prompt":"Partner
    (supplier)","required":true},{"name":"description","type":"text","prompt":"Description","required":true},{"name":"invoice_number","type":"code","prompt":"Invoice number (8 digits)","defaultValue":"{next_invoice_PI}","required":true},{"name":"amount","type":"amount","prompt":"Amount
    (e.g., 1.60)","required":true},{"name":"expense_account","type":"account","prompt":"Expense account (6..)","filter":"^6.*:.*$","required":true},{"name":"liability_account","type":"account","prompt":"Liability
    account (2..)","filter":"^2.*:20.*:200.*:2000.*$","required":true},{"name":"bank_account","type":"account","prompt":"Bank account (1..)","filter":"^1.*:10.*:100.*:1020.*$","required":true}]'
  template: "{invoice_date} * {partner} | {description}\n    ; invoice:{invoice_number}\n    {expense_account}        {default_currency} {amount}\n    {liability_account}      {default_currency} -{amount}\n\n{payment_date} * {partner}\
    \ | Payment of invoice\n    ; Payment:, invoice:{invoice_number}\n    {liability_account}      {default_currency} {amount}\n    {bank_account}           {default_currency} -{amount}"
  validation: '{"balanceCheck":true,"minPostings":2}'
  notes: 'Use this macro when paying a supplier invoice directly from the bank account. This is a two-step process: first record the invoice (creates A/P liability), then pay it. Step 1: Record invoice
    received (creates liability) - Debit: Expense or Asset account, Credit: Accounts Payable (you owe the supplier). Step 2: Pay the invoice (this macro) - Debit: Accounts Payable (reduces liability), Credit:
    Bank account (cash goes out).'
- name: PaymentByStaff
  description: Payment by a member of staff which will then need to be reimbursed
  parameters: '[{"name":"date","type":"date","prompt":"Transaction date","defaultValue":"{today}","required":true},{"name":"partner","type":"partner","prompt":"Partner (supplier)","required":true},{"name":"invoice_number","type":"code","prompt":"Invoice
    number (8 digits)","defaultValue":"{next_invoice_PI}","required":true},{"name":"amount","type":"amount","prompt":"Amount (e.g., 100.50)","required":true},{"name":"description","type":"text","prompt":"Description","required":true},{"name":"expense_account","type":"account","prompt":"Expense
    account (1.. or 6..)","filter":"^6.*:.*$|^1.*:10.*:120.*:.*$|^1.*:14.*:150.*$","required":true},{"name":"staff_account","type":"account","prompt":"Staff member account (2..)","filter":"^2.*:20.*:220.*:2210.*:2210.*$","required":true}]'
  template: "{date} * {partner} | {description}\n    ; invoice:{invoice_number}\n    {expense_account}        {default_currency} {amount}\n    {staff_account}  {default_currency} -{amount}"
  validation: '{"balanceCheck":true,"minPostings":2}'
  notes: 'Use this macro when a staff member pays for a business expense with their own money. The expense is recorded immediately, and a liability is created to reimburse the staff member. Example: Anton
    pays CHF 100 for domain names with his personal credit card. Debit: Expense account (increases expense). Credit: Staff liability account (you owe Anton CHF 100).'
- name: PaymentForGoods
  description: Payment by a member of staff, by cash or from the bank account, for goods which will be sold, either by modifying them or by selling them as is
  parameters: '[{"name":"date","type":"date","prompt":"Transaction date","defaultValue":"{today}","required":true},{"name":"partner","type":"partner","prompt":"Partner (supplier)","required":true},{"name":"invoice_number","type":"code","prompt":"Invoice
    number (8 digits)","defaultValue":"{next_invoice_PI}","required":true},{"name":"amount","type":"amount","prompt":"Amount (e.g., 100.50)","required":true},{"name":"description","type":"text","prompt":"Description","required":true},{"name":"inventory_account","type":"account","prompt":"Inventory
    account (1..)","filter":"^1.*:10.*:120.*:12[0-9][0-9].*$","required":true},{"name":"liability_account","type":"account","prompt":"Liability account (1.. or 2..)","filter":"^1.*:10.*:100.*:10[0-9]0.*$|^2.*:20.*:220.*2210.*$","required":true}]'
  template: "{date} * {partner} | {description}\n    ; invoice:{invoice_number}\n    {inventory_account}      {default_currency} {amount}\n    {liability_account}      {default_currency} -{amount}"
  validation: '{"balanceCheck":true,"minPostings":2}'
  notes: 'Use this macro when purchasing goods for resale (inventory). The goods become an asset until sold. Example: Purchasing CHF 50 of components to build and sell. Debit: Inventory account (asset increases).
    Credit: Accounts Payable or Cash (liability or cash decreases).'
- name: RecordDepreciation UNTESTED
  description: Record annual depreciation for fixed assets (year-end closing)
  parameters: '[{"name":"date","type":"date","prompt":"Depreciation date (typically year-end)","defaultValue":"{year}-12-31","required":true},{"name":"description","type":"text","prompt":"Description (e.g.,
    Annual depreciation for 2025)","required":true},{"name":"depreciation_amount","type":"amount","prompt":"Depreciation amount","required":true},{"name":"asset_account","type":"account","prompt":"Fixed
    asset account (14xx or 15xx)","filter":"^1.*:14.*:15[0-9].*$","required":true},{"name":"depreciation_expense_account","type":"account","prompt":"Depreciation expense account (6800)","filter":"^6.*:6800.*$","required":true}]'
  template: "{date} | {description}\n    ; YearEnd:Depreciation\n    {depreciation_expense_account}    {default_currency} {depreciation_amount}\n    {asset_account}                   {default_currency} -{depreciation_amount}"
  validation: '{"balanceCheck":true,"minPostings":2}'
  notes: 'Use this macro at year-end to record depreciation of fixed assets. Depreciation spreads the cost of an asset over its useful life. Example: CHF 128 annual depreciation on a CHF 640 laptop (5-year
    life). Debit: Depreciation expense (increases expense, reduces profit). Credit: Fixed asset account (reduces asset value).'
- name: RepayStaff
  description: Repaying cash owed to a member of staff
  parameters: '[{"name":"date","type":"date","prompt":"Payment date","defaultValue":"{today}","required":true},{"name":"partner","type":"partner","prompt":"Partner (staff member)","required":true},{"name":"description","type":"text","prompt":"Description","required":true},{"name":"invoice_numbers","type":"text","prompt":"Invoice
    numbers to reimburse (comma-separated, 8 digits each)","required":true},{"name":"amount","type":"amount","prompt":"Total amount (e.g., 33.78)","required":true},{"name":"bank_account","type":"account","prompt":"Bank
    account (1..)","filter":"^1.*:10.*:100.*:1020.*$","required":true},{"name":"staff_account","type":"account","prompt":"Staff member account (2..)","filter":"^2.*:20.*:220.*:2210.*:2210.*$","required":true}]'
  template: "{date} * {partner} | {description}\n    ; Payment:, {invoice_numbers}\n    {bank_account}           {default_currency} -{amount}\n    {staff_account}  {default_currency} {amount}"
  validation: '{"balanceCheck":true,"minPostings":2}'
  notes: 'Use this macro to repay money owed to a staff member for expenses they paid on behalf of the company. This clears the liability created by the PaymentByStaff macro. Example: Repaying Anton CHF
    100 for domain names he purchased. Debit: Staff liability account (reduces liability, you no longer owe Anton). Credit: Bank account (cash goes out).'
- name: TaxPayment
  description: Record payment of provisioned taxes (with adjustment if actual differs)
  parameters: '[{"name":"date","type":"date","prompt":"Payment date","required":true},{"name":"partner","type":"partner","prompt":"Tax authority (e.g., Canton Vaud)","required":true},{"name":"description","type":"text","prompt":"Description
    (e.g., Payment for 2025 taxes)","required":true},{"name":"provision_amount","type":"amount","prompt":"Amount that was provisioned (from year-end provision)","required":true},{"name":"actual_amount","type":"amount","prompt":"Actual
    amount paid (from tax bill)","required":true},{"name":"bank_account","type":"account","prompt":"Bank account to pay from","filter":"^1.*:10.*:100.*:1020.*$","required":true}]'
  template: "{date} * {partner} | {description}\n    ; TaxPayment:\n    2:20:220:2208    {default_currency} {provision_amount}\n    8:8900    {default_currency} {actual_amount - provision_amount}\n    {bank_account}    {default_currency} -{actual_amount}"
  validation: '{"balanceCheck":true,"minPostings":2}'
  notes: 'This macro handles three scenarios: 1. If actual = provision: Only liability and bank accounts are affected. 2. If actual > provision: Additional tax expense is recorded. 3. If actual < provision:
    Tax expense is reduced (negative amount). Example: Provision was CHF 350, actual bill is CHF 380 - Debit 220 (Tax liability): CHF 350 (clears the provision), Debit 8900 (Tax expense): CHF 30 (additional
    expense), Credit 1020 (Bank): CHF 380 (total payment). See the Help section ("Tax provisions and payments across years") for detailed instructions and worked examples.'
- name: TaxProvision
  description: Record year-end tax provision (income tax + capital tax)
  parameters: '[{"name":"date","type":"date","prompt":"Transaction date (typically December 31)","defaultValue":"{year}-12-31","required":true},{"name":"description","type":"text","prompt":"Description
    of tax provision","defaultValue":"Tax provision for {year}","required":true},{"name":"additional_tax_amount","type":"amount","prompt":"Additional tax to provision (total estimated tax for the year,
    minus tax already expensed to 8900 this year)","required":true}]'
  template: "{date} | {description}\n    ; YearEnd:TaxProvision\n    8:8900    {default_currency} {additional_tax_amount}\n    2:20:220:2208    {default_currency} -{additional_tax_amount}"
  validation: '{"balanceCheck":true,"minPostings":2}'
  notes: Record year-end tax provision for income and capital taxes. The amount is NOT your total tax for the year - it is the difference between your total estimated tax and whatever has already been recognised
    as expense (account 8900) from acomptes billed or paid earlier in the same year. This creates a liability (2208) for the remaining tax owed but not yet paid. See the Help section ("Tax provisions and
    payments across years") for detailed instructions and worked examples.
